name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Register notebook kernel
        # The tutorials declare the "python3" kernel; register this interpreter
        # as that kernel so myst-nb can execute them at build time.
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Strict HTML build (executes notebooks offline)
        env:
          NEXSCI_RV_OFFLINE_FIXTURES: "1"
        run: python -m sphinx -W -b html docs docs/_build/html
      - name: Link check
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
      - name: Upload Pages artifact
        # Always produced — on PRs this serves as a downloadable preview of the
        # rendered site; on main it is what the deploy job publishes.
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # Publish to GitHub Pages. Gated on the ENABLE_PAGES repo variable so this is a
  # no-op until the repo is public — public Pages from a private repo needs a paid
  # plan. To go live: in repo Settings → Pages set the source to "GitHub Actions",
  # then add an Actions repository variable ENABLE_PAGES=true.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
