name: Notebooks

on:
  pull_request:
    paths:
      - "docs/tutorials/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"
      - name: Run notebooks via nbmake (offline)
        env:
          NEXSCI_RV_OFFLINE_FIXTURES: "1"
        run: pytest --nbmake docs/tutorials/
