name: Integration (network)

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run network tests
        run: |
          set +e
          pytest -m network -v
          status=$?
          # pytest exits 5 when no tests are collected. The `network` marker
          # exists in pyproject.toml but no tests carry it yet, so treat 5 as
          # success rather than failing the nightly schedule.
          if [ $status -eq 5 ]; then
            echo "No tests marked 'network' — skipping."
            exit 0
          fi
          exit $status
